<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Priority Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --text: #f0f0f5;
    --muted: #7a7a8c;
    --accent: #e8ff5a;
    --accent-dim: rgba(232,255,90,0.12);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.12);
    --orange: #ff9040;
    --orange-dim: rgba(255,144,64,0.12);
    --green: #44e5a0;
    --green-dim: rgba(68,229,160,0.12);
    --blue: #5aabff;
    --blue-dim: rgba(90,171,255,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 60% at 70% -10%, rgba(232,255,90,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at -10% 80%, rgba(90,171,255,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 48px;
  }

  .header-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.8;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(36px, 6vw, 58px);
    font-weight: 800;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 span {
    color: var(--accent);
  }

  .header-sub {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    flex: 1;
    min-width: 120px;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat.critical .stat-value { color: var(--red); }
  .stat.warning .stat-value { color: var(--orange); }
  .stat.done .stat-value { color: var(--green); }
  .stat.total .stat-value { color: var(--accent); }

  /* Add task form */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 36px;
    transition: border-color 0.2s;
  }

  .add-form:focus-within {
    border-color: rgba(232,255,90,0.4);
  }

  .form-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .form-grid .full {
    grid-column: 1 / -1;
  }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="text"], input[type="date"], textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    appearance: none;
    color-scheme: dark;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,255,90,0.1);
  }

  textarea {
    resize: vertical;
    min-height: 70px;
    line-height: 1.5;
  }

  select option {
    background: var(--surface2);
  }

  .btn-add {
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 12px 28px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-add:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(232,255,90,0.3);
  }

  .btn-add:active { transform: translateY(0); }

  /* Filters */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .sort-select {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    outline: none;
  }

  /* Task cards */
  .tasks-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: start;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    animation: slideIn 0.25s ease both;
    position: relative;
    overflow: hidden;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  /* Priority left stripe */
  .task-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 14px 0 0 14px;
  }

  .task-card.urgent::before   { background: var(--red); }
  .task-card.high::before     { background: var(--orange); }
  .task-card.medium::before   { background: var(--accent); }
  .task-card.low::before      { background: var(--blue); }
  .task-card.completed::before { background: var(--green); }

  .task-card.completed { opacity: 0.55; }

  /* Checkbox */
  .task-check {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }

  .task-check:hover { border-color: var(--green); }
  .task-check.checked { background: var(--green); border-color: var(--green); }
  .task-check.checked::after { content: '✓'; color: #0d0d0f; font-size: 11px; font-weight: bold; }

  /* Task content */
  .task-body {}

  .task-name {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .task-card.completed .task-name {
    text-decoration: line-through;
    color: var(--muted);
  }

  .task-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .badge.urgent  { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(255,77,109,0.3); }
  .badge.high    { background: var(--orange-dim);  color: var(--orange);  border: 1px solid rgba(255,144,64,0.3); }
  .badge.medium  { background: var(--accent-dim);  color: var(--accent);  border: 1px solid rgba(232,255,90,0.3); }
  .badge.low     { background: var(--blue-dim);    color: var(--blue);    border: 1px solid rgba(90,171,255,0.3); }
  .badge.done    { background: var(--green-dim);   color: var(--green);   border: 1px solid rgba(68,229,160,0.3); }

  .deadline-chip {
    font-size: 11px;
    color: var(--muted);
    display: flex; align-items: center; gap: 4px;
  }

  .deadline-chip.overdue  { color: var(--red); }
  .deadline-chip.soon     { color: var(--orange); }
  .deadline-chip.ok       { color: var(--green); }

  /* Importance bar */
  .importance-bar {
    margin-top: 10px;
    display: flex; align-items: center; gap: 8px;
  }

  .importance-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: 70px;
    flex-shrink: 0;
  }

  .bar-track {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .bar-fill.urgent  { background: var(--red);    width: 100%; }
  .bar-fill.high    { background: var(--orange);  width: 75%; }
  .bar-fill.medium  { background: var(--accent);  width: 50%; }
  .bar-fill.low     { background: var(--blue);    width: 25%; }

  .importance-pct {
    font-size: 11px;
    color: var(--muted);
    width: 30px;
    text-align: right;
    flex-shrink: 0;
  }

  /* Actions */
  .task-actions {
    display: flex; gap: 6px;
    flex-direction: column;
    align-items: flex-end;
  }

  .btn-icon {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }

  .btn-icon:hover.delete { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .btn-icon:hover.edit   { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .empty-state h3 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    color: var(--text);
    margin-bottom: 8px;
    opacity: 0.5;
  }

  .empty-state p {
    font-size: 13px;
    opacity: 0.4;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 500px;
    transform: scale(0.95);
    transition: transform 0.2s;
  }

  .modal-overlay.open .modal { transform: scale(1); }

  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
  }

  .btn-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
  }

  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end;
    margin-top: 20px;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

  /* Notification */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 13px;
    color: var(--text);
    z-index: 200;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .full { grid-column: 1; }
    .task-card { grid-template-columns: auto 1fr; }
    .task-actions { flex-direction: row; grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-tag">// Task Manager v1.0 &nbsp;·&nbsp; <span style="color:var(--muted)">Made by</span> R-NH2 Industries</div>
    <h1>Task<span>Flow</span></h1>
    <p class="header-sub">Your deadlines, prioritized & never forgotten.</p>
  </header>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat critical"><div class="stat-value" id="stat-critical">0</div><div class="stat-label">Critical</div></div>
    <div class="stat warning"><div class="stat-value" id="stat-warning">0</div><div class="stat-label">Due Soon</div></div>
    <div class="stat total"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat done"><div class="stat-value" id="stat-done">0</div><div class="stat-label">Completed</div></div>
  </div>

  <!-- Add Form -->
  <div class="add-form">
    <div class="form-title">+ New Task</div>
    <div class="form-grid">
      <div class="full">
        <label for="task-name">Task Name</label>
        <input type="text" id="task-name" placeholder="What needs to be done?" />
      </div>
      <div class="full">
        <label for="task-desc">Description (optional)</label>
        <textarea id="task-desc" placeholder="Add details..."></textarea>
      </div>
      <div>
        <label for="task-deadline">Deadline</label>
        <input type="date" id="task-deadline" />
      </div>
      <div>
        <label for="task-priority">Priority</label>
        <select id="task-priority">
          <option value="urgent">🔴 Urgent — Drop everything</option>
          <option value="high">🟠 High — Important, soon</option>
          <option value="medium" selected>🟡 Medium — Normal pace</option>
          <option value="low">🔵 Low — When possible</option>
        </select>
      </div>
    </div>
    <button class="btn-add" onclick="addTask()">
      <span>+</span> Add Task
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
    <button class="filter-btn" onclick="setFilter('completed', this)">Done</button>
    <button class="filter-btn" onclick="setFilter('urgent', this)">🔴 Urgent</button>
    <select class="sort-select" onchange="setSort(this.value)">
      <option value="created">Sort: Newest</option>
      <option value="deadline">Sort: Deadline</option>
      <option value="priority">Sort: Priority</option>
    </select>
  </div>

  <!-- Tasks list -->
  <div class="tasks-list" id="tasks-list"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Edit Task</div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="full">
        <label>Task Name</label>
        <input type="text" id="edit-name" />
      </div>
      <div class="full">
        <label>Description</label>
        <textarea id="edit-desc"></textarea>
      </div>
      <div>
        <label>Deadline</label>
        <input type="date" id="edit-deadline" />
      </div>
      <div>
        <label>Priority</label>
        <select id="edit-priority">
          <option value="urgent">🔴 Urgent</option>
          <option value="high">🟠 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">🔵 Low</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Footer -->
<footer style="text-align:center; padding: 32px 24px 48px; position:relative; z-index:1;">
  <div style="display:inline-flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:8px 20px;">
    <span style="font-size:16px;">⬡</span>
    <span style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted);">Made by</span>
    <span style="font-family:'Syne',sans-serif; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:0.05em;">R-NH2 Industries</span>
  </div>
</footer>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ─── State ───────────────────────────────────────────────────────────
  let tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
  let filter = 'all';
  let sortBy = 'created';
  let editingId = null;

  const priorityOrder = { urgent: 0, high: 1, medium: 2, low: 3 };
  const importancePct = { urgent: '100%', high: '75%', medium: '50%', low: '25%' };

  // ─── Persist ─────────────────────────────────────────────────────────
  function save() {
    localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
  }

  // ─── Toast ────────────────────────────────────────────────────────────
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ─── Add Task ─────────────────────────────────────────────────────────
  function addTask() {
    const name = document.getElementById('task-name').value.trim();
    if (!name) { toast('⚠ Please enter a task name'); return; }

    const task = {
      id: Date.now().toString(),
      name,
      desc: document.getElementById('task-desc').value.trim(),
      deadline: document.getElementById('task-deadline').value,
      priority: document.getElementById('task-priority').value,
      completed: false,
      created: Date.now()
    };

    tasks.unshift(task);
    save();
    render();
    toast('✓ Task added');

    document.getElementById('task-name').value = '';
    document.getElementById('task-desc').value = '';
    document.getElementById('task-deadline').value = '';
    document.getElementById('task-priority').value = 'medium';
  }

  // ─── Toggle Complete ──────────────────────────────────────────────────
  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.completed = !t.completed; save(); render(); }
  }

  // ─── Delete ───────────────────────────────────────────────────────────
  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
    toast('🗑 Task deleted');
  }

  // ─── Edit ─────────────────────────────────────────────────────────────
  function openEdit(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    editingId = id;
    document.getElementById('edit-name').value = t.name;
    document.getElementById('edit-desc').value = t.desc;
    document.getElementById('edit-deadline').value = t.deadline;
    document.getElementById('edit-priority').value = t.priority;
    document.getElementById('edit-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
  }

  function saveEdit() {
    const t = tasks.find(t => t.id === editingId);
    if (!t) return;
    const name = document.getElementById('edit-name').value.trim();
    if (!name) { toast('⚠ Task name required'); return; }
    t.name = name;
    t.desc = document.getElementById('edit-desc').value.trim();
    t.deadline = document.getElementById('edit-deadline').value;
    t.priority = document.getElementById('edit-priority').value;
    save(); render(); closeModal();
    toast('✓ Task updated');
  }

  // ─── Filters & Sort ───────────────────────────────────────────────────
  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function setSort(s) { sortBy = s; render(); }

  // ─── Deadline utils ───────────────────────────────────────────────────
  function getDeadlineInfo(deadline) {
    if (!deadline) return { label: 'No deadline', cls: '' };
    const now = new Date(); now.setHours(0,0,0,0);
    const d = new Date(deadline);
    const diff = Math.round((d - now) / 86400000);
    if (diff < 0)  return { label: `Overdue by ${Math.abs(diff)}d`, cls: 'overdue' };
    if (diff === 0) return { label: 'Due today!', cls: 'overdue' };
    if (diff === 1) return { label: 'Due tomorrow', cls: 'soon' };
    if (diff <= 3)  return { label: `Due in ${diff} days`, cls: 'soon' };
    return { label: `Due ${d.toLocaleDateString('en-US', {month:'short', day:'numeric'})}`, cls: 'ok' };
  }

  // ─── Render ───────────────────────────────────────────────────────────
  function render() {
    let list = [...tasks];

    // Filter
    if (filter === 'active')    list = list.filter(t => !t.completed);
    if (filter === 'completed') list = list.filter(t =>  t.completed);
    if (filter === 'urgent')    list = list.filter(t => t.priority === 'urgent' && !t.completed);

    // Sort
    if (sortBy === 'deadline') {
      list.sort((a, b) => {
        if (!a.deadline && !b.deadline) return 0;
        if (!a.deadline) return 1;
        if (!b.deadline) return -1;
        return a.deadline.localeCompare(b.deadline);
      });
    } else if (sortBy === 'priority') {
      list.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
    } else {
      list.sort((a, b) => b.created - a.created);
    }

    // Stats
    const active = tasks.filter(t => !t.completed);
    const now = new Date(); now.setHours(0,0,0,0);
    const critical = active.filter(t => {
      if (t.priority === 'urgent') return true;
      if (t.deadline) {
        const diff = Math.round((new Date(t.deadline) - now) / 86400000);
        return diff <= 1;
      }
      return false;
    });
    const soon = active.filter(t => {
      if (!t.deadline) return false;
      const diff = Math.round((new Date(t.deadline) - now) / 86400000);
      return diff > 1 && diff <= 3;
    });

    document.getElementById('stat-critical').textContent = critical.length;
    document.getElementById('stat-warning').textContent = soon.length;
    document.getElementById('stat-total').textContent = tasks.length;
    document.getElementById('stat-done').textContent = tasks.filter(t => t.completed).length;

    // Render cards
    const container = document.getElementById('tasks-list');

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">✦</div>
          <h3>No tasks here</h3>
          <p>Add a task above to get started.</p>
        </div>`;
      return;
    }

    container.innerHTML = list.map(t => {
      const dl = getDeadlineInfo(t.deadline);
      const pct = { urgent: 100, high: 75, medium: 50, low: 25 }[t.priority];
      const cardClass = t.completed ? 'completed' : t.priority;
      const checkClass = t.completed ? 'checked' : '';
      const priorityLabel = { urgent: 'Urgent', high: 'High', medium: 'Medium', low: 'Low' }[t.priority];
      const badgeCls = t.completed ? 'done' : t.priority;
      const badgeLabel = t.completed ? 'Done' : priorityLabel;

      return `
      <div class="task-card ${cardClass}" data-id="${t.id}">
        <div class="task-check ${checkClass}" onclick="toggleTask('${t.id}')"></div>
        <div class="task-body">
          <div class="task-name">${escapeHtml(t.name)}</div>
          ${t.desc ? `<div class="task-desc">${escapeHtml(t.desc)}</div>` : ''}
          <div class="task-meta">
            <span class="badge ${badgeCls}">${badgeLabel}</span>
            ${t.deadline ? `<span class="deadline-chip ${dl.cls}">⏱ ${dl.label}</span>` : ''}
          </div>
          ${!t.completed ? `
          <div class="importance-bar">
            <span class="importance-label">Importance</span>
            <div class="bar-track"><div class="bar-fill ${t.priority}" style="width:${pct}%"></div></div>
            <span class="importance-pct">${pct}%</span>
          </div>` : ''}
        </div>
        <div class="task-actions">
          <button class="btn-icon edit" onclick="openEdit('${t.id}')" title="Edit">✎</button>
          <button class="btn-icon delete" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Close modal on overlay click
  document.getElementById('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Enter key to add
  document.getElementById('task-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // Set today's date as min for deadline inputs
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('task-deadline').setAttribute('min', today);
  document.getElementById('edit-deadline').setAttribute('min', today);

  render();
</script>
</body>
</html>
